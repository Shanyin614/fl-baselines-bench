method:
  name: fesem
  num_clusters: 4
  init: random_perturb
  center_perturb_sigma: 0.05
  assignment_split: val
  assignment_interval: 1
  min_cluster_size: 5
  empty_cluster_strategy: keep
  kmeans_local_epochs: 1
  kmeans_sample_frac: 1.0
  probe_pool_size: 16
  probe_sigma: 0.05
  dpmm_max_components: 10
  dpmm_prior: 0.03
