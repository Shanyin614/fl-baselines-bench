method:
  name: fesem
  num_clusters: 4
  init: random_perturb        # same | random_perturb | warmup_kmeans
  center_perturb_sigma: 0.01
  assignment_split: val
  assignment_interval: 1
  min_cluster_size: 2
  empty_cluster_strategy: keep # keep | random_perturb
  kmeans_local_epochs: 1
  kmeans_sample_frac: 1.0
