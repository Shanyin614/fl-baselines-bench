protocol:
  name: fashionmnist_dirichlet_protocol_v1

runtime:
  seed: 42
  device: auto

output:
  dir: outputs/csv
  name: results.csv
  save_round_metrics: true

dataset:
  name: fashionmnist
  data_root: data
  split_dir: splits/fashionmnist
  split_file: null

  num_classes: 10
  num_clients: 100

  partition: dirichlet
  num_true_clusters: 4
  dir_alpha_inter: 0.1
  dir_alpha_intra: 10.0

  # Only used if partition: label_group/manual; ignored by dirichlet partition.
  major_ratio: 0.85
  true_groups:
    - [0, 2, 6]
    - [1, 3]
    - [4, 8]
    - [5, 7, 9]

  train_samples_per_client: 400
  test_samples_per_client: 100
  val_ratio: 0.2
  num_workers: 0

model:
  name: small_cnn
  num_classes: 10

train:
  total_rounds: 100
  warmup_rounds: 5
  client_frac: 0.2
  local_epochs: 2
  batch_size: 64
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0
  proximal_mu: 0.0

eval:
  eval_every: 1
  assignment_split: val
  test_split: test
  metrics:
    - client_avg_acc
    - micro_acc
    - global_macro_f1
    - worst_client_acc
    - acc_std
    - ari
    - nmi
    - purity
